name: Aplikacja mobilna

# Buduje i testuje klienta KMP. Osobno od kontroli serwisu webowego, bo to
# inny toolchain i inny czas budowania.
on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Testy wspólne
        run: ./gradlew :composeApp:testDebugUnitTest --console=plain

      - name: Build APK (debug)
        run: ./gradlew :composeApp:assembleDebug --console=plain

      - name: APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: fiszki-debug-apk
          path: mobile/composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Raporty z testów, gdy coś padło
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raporty-testow
          path: mobile/composeApp/build/reports/tests/
